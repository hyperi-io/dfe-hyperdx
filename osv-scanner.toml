# osv-scanner verdicts for yarn.lock, which is upstream HyperDX's tree. At the
# root because osv-scanner reads its config only beside the lockfile.
#
# Advisories are fixed in the security layer during a release sync, never here
# and never in yarn.lock by hand: docs/fork/sync-cycle.md "Adding a security fix".
#
# Every entry is graded against what the root Dockerfile ships - the api
# production focus, Next's standalone trace and the app's browser bundle - for
# @hyperdx/app@2.41.0. Re-grade them on each sync and delete any id the scanner
# no longer reports.

