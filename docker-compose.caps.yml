# DFE memory caps - REUSABLE resource-limit layer.
#
# WHY: never run uncapped docker on a dev laptop (OOM risk). Layer this file LAST
# so every container has a hard memory ceiling. Applied by `docker compose up`
# (Compose v2 honours deploy.resources.limits.memory outside swarm).
#
# REUSE: dfe-docker layers this same file for the HyperDX stack. The limits below
# are the resource-sizing SSoT and map 1:1 to Kubernetes:
#   deploy.resources.limits.memory  ->  k8s containers[].resources.limits.memory
#   deploy.resources.reservations   ->  k8s containers[].resources.requests
#
# Compose rejects a service that has a `deploy` block but no image or build, so a
# caps file may name only services its base files define. This file holds the
# services both stacks define. docker-compose.caps.dev.yml holds the two that only
# the dev stack defines.
#
# Usage (dev - app runs locally via yarn):
#   docker compose --env-file .env.dfe \
#     -f docker-compose.dev.yml -f docker-compose.dfe.dev.yml \
#     -f docker-compose.caps.yml -f docker-compose.caps.dev.yml up -d
# Usage (prod image - app in a container): swap dfe.dev.yml for dfe.yml and drop caps.dev.yml.
#
# Total dev ceiling ~= 3.4 GB (CH 2g dominates). Tune CH down to 1536m if tight.

services:
  ch-server:
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

  postgres:
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  ferretdb:
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m

  otel-collector:
    deploy:
      resources:
        limits:
          memory: 300m
# NB: `app` is not capped here. It exists only in the prod-image stack, so in dev
# it would be a service with `deploy` and no image.
