# Fork security overrides - the register of dependency pins WE carry.
#
# THE BAR. An entry here is a deliberate divergence from upstream's dependency
# tree, and it is only justified when BOTH hold:
#
#   1. Severity is HIGH or CRITICAL, and
#   2. there is a REAL VECTOR - the vulnerable code path is actually reachable
#      in how DFE runs this fork.
#
# Point 2 is the one that gets skipped. Most advisories against a transitive
# dependency are unreachable here: the package is present but the vulnerable
# function is never imported, or it is only reachable from a code path we do
# not ship (a dev server, a CLI we do not run, a cloud provider adapter we do
# not configure). "npm audit says high" is NOT a vector. Write down how an
# attacker actually gets there, or do not add the entry.
#
# WHY THE BAR IS HIGH. Every entry is permanent conflict surface in
# package.json - the one file upstream churns most - and it will almost
# certainly be fixed upstream, at which point our pin is dead weight that has
# to be found and removed. The cost is not the pin, it is the unwinding.
#
# THE UNWIND. That is what `vector` is for, and what
# `scripts/security-override.py --check` automates: it compares each entry
# against what UPSTREAM's lockfile resolves at our merge base and FAILS when
# upstream has caught up, so a redundant pin nags us to delete it. That inverse
# nag is the whole point - an override nobody removes is how a fork silently
# drifts. Our own lockfile cannot answer it: the pin holds ours above the floor.
#
# ADDING ONE
#   1. Add the entry below with every field filled in. `vector` is prose, not a
#      CVSS string - describe the path.
#   2. Run `scripts/security-override.py --apply && yarn install`, which writes
#      the `resolutions` entry - never edit that block by hand - and note the
#      pin in docs/fork/what-we-changed.md's change catalogue.
#   3. Set `upstream` to the upstream issue or release that tracks the fix, or
#      `none`. We fix it here and do not raise it upstream: `--check` reads
#      upstream's lockfile, so the unwind never waits on a link.
#
# REMOVING ONE
#   `--check` tells you when. Delete the entry, delete the resolutions line,
#   run `yarn install` to re-resolve, done.

overrides:
  - package: systeminformation
    # Narrowest range that clears every open advisory against this package.
    # ^ rather than >= so a major bump cannot arrive silently.
    range: '^5.33.16'
    advisory: GHSA-5xpp-75jx-m839
    severity: high
    vector: >-
      The API instantiates @opentelemetry/host-metrics in
      packages/api/src/index.ts, which calls systeminformation's networkStats()
      on the metrics interval, and networkStats() calls the vulnerable
      networkInterfaces() (systeminformation/lib/network.js:1302,1518). That
      function interpolates an interfaces(5) source-directive path
      (GHSA-5xpp-75jx-m839) and a NetworkManager connection profile name
      (GHSA-hvx9-hwr7-wjj9) into a shell command, so anyone who can write host
      network configuration gets code execution inside the API process rather
      than only on the host. The sink is provably live; the source is
      host-local, not remote. It is the only pin we carry with a live sink. The
      floor is 5.33.16 for GHSA-3f7j-7jwc-fxfj, a Windows-only PowerShell
      injection in services(). host-metrics requires only
      systeminformation/lib/network (build/src/stats/si.js:22), so services() is
      never loaded, and the image runs Linux. No live vector, taken because the
      vulnerable copy ships and the fix is one generated line.
    upstream: https://github.com/hyperdxio/hyperdx/issues/3306
    added: 2026-08-26
  - package: follow-redirects
    range: '^1.16.2'
    advisory: GHSA-mrwp-f3q8-3g9p
    severity: high
    vector: >-
      No live vector. It is pinned because the vulnerable copy ships and the fix
      is one generated line. packages/api/package.json:32 declares
      @slack/webhook, whose axios 1.20.0 resolves follow-redirects into the
      production focus. GHSA-mrwp-f3q8-3g9p (a cross-realm sensitiveHeaders
      array is discarded), GHSA-q3jh-wrc6-jgq8 (array-form headers) and
      GHSA-8r9p-f939-6h3c (sensitiveHeaders escaping) all need follow-redirects
      to follow a cross-origin redirect. @slack/webhook's IncomingWebhook.js:26
      sets maxRedirects to 0, so axios takes the native http transport
      (lib/adapters/http.js:1051) and follow-redirects follows nothing. Nothing
      in packages/*/src sets sensitiveHeaders. nx's exact 1.16.0 pin, dev only,
      moves with it.
    upstream: none
    added: 2026-10-21
  - package: body-parser
    range: '^1.20.9'
    advisory: GHSA-27r3-jxmh-p828
    severity: high
    vector: >-
      express 4.22.1 declares body-parser ~1.20.3 and resolves 1.20.6. On a
      request carrying Content-Encoding, body-parser pipes the body into a
      decompression stream and leaves it piped with no error listener once the
      body is read, so trailing bytes after a valid frame reach the finished
      decoder and its error ends the process (body-parser lib/read.js:151-188).
      The three parsers at packages/api/src/api-app.ts:78-80 run before routing
      and before the engine token check, so any caller that reaches the API can
      do it unauthenticated. 1.20.9 detaches and destroys the stream and adds an
      error listener. The pin also covers the OpAMP raw parser (opamp/app.ts:15)
      and the PromQL urlencoded parser (routers/api/prometheus.ts:56), which
      stay inflating.
    upstream: none
    added: 2026-10-28
# Example of the shape (keep commented - an empty register is the goal state):
#
#   - package: some-parser
#     # Yarn resolutions range. Narrowest thing that clears the advisory.
#     range: ">=1.2.3"
#     advisory: GHSA-xxxx-yyyy-zzzz
#     severity: critical          # high | critical only - see THE BAR above
#     # HOW an attacker reaches it in OUR deployment. Be specific.
#     vector: >-
#       The receiver hands untrusted event bodies to some-parser.parse() on the
#       ingest path, so a crafted payload reaches the vulnerable branch without
#       authentication.
#     upstream: none            # or the upstream issue/release that tracks it
#     added: 2026-07-23
