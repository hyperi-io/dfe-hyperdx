# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

language: typescript
# Revert to the house default once the loop in docs/fork/security-sync.md comes
# back clean. The triaged advisory exclusions in .yarnrc.yml apply whenever the
# step does run.
quality:
  enabled: true
  typescript:
    audit:
      mode: warn
      reason: "npm's advisory endpoint answers about 5 POSTs in 12 and hangs on the rest, so a blocking gate is a coin toss rather than a signal; triaged exclusions live in .yarnrc.yml"
test:
  enabled: true
  coverage: true
build:
  enabled: false
publish:
  enabled: true
  target: internal
  destinations_oss:
    npm: false
  container:
    enabled: true
    dockerfile: Dockerfile
    # amd64 only: the arm64 half runs under qemu and Next.js's build-time
    # font fetch (next/font) times out inside the emulator. Revisit with an
    # arm runner or fonts vendored offline.
    platforms:
      - linux/amd64
typescript:
  package_manager: yarn
