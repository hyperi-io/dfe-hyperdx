# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

language: typescript
# audit was held at `warn` while 99 inherited alerts sat untriaged. They are
# triaged now, so this inherits the house default of `blocking` at
# audit_level: moderate. Advisories judged unreachable are excluded by id in
# .yarnrc.yml, each with its reason; the traces are in
# docs/fork/security-sync.md.
quality:
  enabled: true
test:
  enabled: true
  coverage: true
build:
  enabled: false
publish:
  enabled: true
  target: internal
  destinations_oss:
    npm: false
  container:
    enabled: true
    dockerfile: Dockerfile
    # amd64 only: the arm64 half runs under qemu and Next.js's build-time
    # font fetch (next/font) times out inside the emulator. Revisit with an
    # arm runner or fonts vendored offline.
    platforms:
      - linux/amd64
typescript:
  package_manager: yarn
