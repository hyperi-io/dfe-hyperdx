#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

language: typescript
quality:
  enabled: true
  exclude_paths:
    # Spike records name the files they proposed at the time, not files the repo holds.
    - .hyperi/spikes
test:
  enabled: true
  coverage: true
build:
  enabled: false
release:
  enabled: true
  destinations:
    npm: false
  container:
    enabled: true
    dockerfile: Dockerfile
    # amd64 only: the arm64 half runs under qemu and Next.js's build-time
    # font fetch (next/font) times out inside the emulator. Revisit with an
    # arm runner or fonts vendored offline.
    platforms:
      - linux/amd64
typescript:
  package_manager: yarn
