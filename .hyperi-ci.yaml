# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

language: typescript
# A fork of upstream HyperDX: version bumps come from our own first-parent history, so upstream feat: commits arriving in a sync merge do not move the minor.
classification: fork
# The image label and the GHCR package page; the upstream package.json carries none we own.
description:
  'HyperDX search and dashboards for DFE: the API and the web app in one image'
quality:
  enabled: true
  exclude_paths:
    # Spike records name the files they proposed at the time, not files the repo holds.
    - .hyperi/spikes
    # Upstream's Dockerfiles, identical to the merge base. hadolint flags COPY --from a named build context (DL3022), unpinned apk add (DL3018) and shell-form CMD (DL3025).
    - docker/hyperdx/Dockerfile
    - docker/otel-collector/Dockerfile
    - packages/api/Dockerfile
    - packages/app/Dockerfile
    # Upstream's compose files, identical to the merge base. Their image tags come from the env file, and the dev prometheus image is `latest`.
    - docker-compose.yml
    - docker-compose.dev.yml
    # Upstream's agent docs, identical to the merge base. They name paths gone from upstream or not carried here, and editing them is conflict surface on every sync.
    - AGENTS.md
    - agent_docs/code_style.md
    - agent_docs/data_viz_colors.md
  # Every flagged line here is upstream's, byte-identical to the merge base, so editing it is conflict surface on every sync.
  charset_exclude:
    - .github/actions/e2e-setup/action.yml
    - .github/actions/e2e-teardown/action.yml
    - .github/scripts/__tests__/release-notes.test.mjs
    - .github/scripts/release-notes.mjs
    - .github/workflows/docker-build.yml
    - .github/workflows/release-reminder.yml
    - scripts/ci/dupes.mjs
    - scripts/ci/ratchet.mjs
    - scripts/ci/smoke-all-in-one.sh
    - scripts/dev-env.sh
    - scripts/ensure-dev-portal.sh
    - scripts/test-e2e.sh
    # Ours, but the only flagged line is the licence header, and licence text is left as written.
    - .github/workflows/ci.yml
    - scripts/dfe-lint-ours.mjs
  # osv-scanner verdicts live in osv-scanner.toml; a fix goes in the security layer during a sync, see docs/fork/sync-cycle.md "Adding a security fix".
  # Mirrors an entry in security/accepted.yaml, which hyperi-ci's semgrep does not read.
  ignore:
    - tool: semgrep
      id: package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age
      reason:
        'renovate.json takes minimumReleaseAge from its org preset, which the
        rule cannot follow'
test:
  enabled: true
  coverage: true
build:
  enabled: false
release:
  enabled: true
  destinations:
    npm: false
  container:
    enabled: true
    dockerfile: Dockerfile
    # The Dockerfile installs and builds on the build host and runs only its runtime stage per arch, so arm64 never emulates the Next build.
    # Listed rather than inherited: the Dockerfile maps exactly these two arches to their prebuilt packages.
    platforms:
      - linux/amd64
      - linux/arm64
    # The API reports CODE_VERSION on /health and in its telemetry; without it every image reports an empty version.
    build_args:
      CODE_VERSION: '{version}'
  # The contract is committed because a TypeScript app has no binary to emit one.
  helm:
    enabled: true
    contract: dfe/deploy/contract.json
    library: '2.14.15'
