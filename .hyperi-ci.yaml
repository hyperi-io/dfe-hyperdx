language: typescript
quality:
  enabled: true
  typescript:
    audit: warn
test:
  enabled: true
  coverage: true
build:
  enabled: false
publish:
  enabled: true
  target: internal
  destinations_oss:
    npm: false
  container:
    enabled: true
    dockerfile: Dockerfile
typescript:
  package_manager: yarn
