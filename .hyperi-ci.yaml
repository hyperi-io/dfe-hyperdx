#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

language: typescript
# audit is `warn` because npm's advisory API answers no POST, so no client can
# pass it; revert to the house default `blocking` once the check in
# docs/fork/security-sync.md returns a body. The triaged advisory exclusions in
# .yarnrc.yml still apply whenever the step does run.
quality:
  enabled: true
  typescript:
    audit: warn
test:
  enabled: true
  coverage: true
build:
  enabled: false
publish:
  enabled: true
  target: internal
  destinations_oss:
    npm: false
  container:
    enabled: true
    dockerfile: Dockerfile
    # amd64 only: the arm64 half runs under qemu and Next.js's build-time
    # font fetch (next/font) times out inside the emulator. Revisit with an
    # arm runner or fonts vendored offline.
    platforms:
      - linux/amd64
typescript:
  package_manager: yarn
