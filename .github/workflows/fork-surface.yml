# Project:   dfe-hyperdx
# File:      .github/workflows/fork-surface.yml
# Purpose:   Enforce the conflict-surface catalogue in CI, not just locally.
#
# License:   MIT - HYPERI PTY LIMITED
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# The pre-commit hook only fires for people who ran
# `git config core.hooksPath .githooks`. A fresh clone has not, and neither has
# any agent working in a container - so the local hook is a convenience, not a
# control. This is the control.
#
# It is a separate workflow rather than a step inside ci.yml because ci.yml
# delegates wholesale to hyperi-ci's reusable ts-ci.yml, and this check is
# fork-specific: no other HyperI repo has an upstream to diverge from.

name: fork-surface

'on':
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fork-surface-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_URL: https://github.com/hyperdxio/hyperdx.git

jobs:
  surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      # The guard classifies a path by asking whether it exists in the upstream
      # baseline, so it needs the upstream ref. Without it the script assumes
      # every path IS upstream and errs towards flagging - loud, but noisy.
      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || true
          git fetch --no-tags upstream

      # FIRST, because everything below is a reading taken with these tools. A
      # green surface check from a broken guard proves nothing, and the tools
      # decide what fails the build and what gets stripped before a merge - so
      # a regression in them is silent and lands in the sync, not here.
      #
      # The suites drive the real scripts against real throwaway git repos, so
      # they need git and stdlib python and nothing else.
      - name: Test the fork tooling
        run: python3 -m unittest discover -s scripts/__tests__ -v

      # github context goes through `env:`, never straight into the shell. A
      # branch name is attacker-controllable on a fork PR, and interpolating it
      # into `run:` executes it. Caught by scripts/attribute-findings.py.
      - name: Check conflict surface
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/${BASE_REF}"
          else
            base='origin/main'
          fi
          echo "Checking $base...HEAD"
          .githooks/fork-surface-check.py --base "$base"

      # The temporary security layer is GENERATED, so it can drift from its
      # declaration the moment somebody edits the resolutions block by hand.
      # That drift is silent until a sync, which is exactly when it is most
      # expensive, so it is checked on every PR instead.
      - name: Check the security layer matches its register
        run: scripts/security-override.py --verify

      # A merge that moved the upstream base but not the pin leaves every later
      # "which upstream is this built on?" as guesswork.
      - name: Check the upstream pin matches the tree
        run: scripts/upstream-pin.py --verify
