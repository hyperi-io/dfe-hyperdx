name: CI

'on':
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: ''
        description:
          'Tag to re-publish (existing tag). Omit + set from-head to release
          HEAD.'
      from-head:
        type: string
        required: false
        default: ''
        description:
          "'true' to release/retry the current HEAD -- the CI creates the tag
          (issue #35)."
      bump:
        type: string
        required: false
        default: 'auto'
        description:
          'Version resolution for from-head: auto | patch | minor (forced) |
          X.Y.Z (exact version).'

# The most ts-ci.yml's release tail asks for (tag, GHCR push, release notes); the
# reusable workflow narrows each of its own jobs from here.
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/ts-ci.yml@main
    with:
      tag: ${{ inputs.tag || '' }}
      from-head: ${{ inputs.from-head || '' }}
      bump: ${{ inputs.bump || 'auto' }}
      # PRs run the release's container build of the root Dockerfile (linux/amd64, no push), so a broken Dockerfile fails the PR instead of the release.
      branch-build: 'true'
    secrets: inherit
