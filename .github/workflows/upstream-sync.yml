# Project:   dfe-hyperdx
# File:      .github/workflows/upstream-sync.yml
# Purpose:   Scheduled upstream-drift sync -- merge hyperdxio/hyperdx into a bot
#            branch, let git rerere replay our resolved conflicts, build+test,
#            then open a PR (clean) or an issue (unresolved conflicts remain).
#
# License:   MIT - HYPERI PTY LIMITED
# Copyright: (c) 2026 HYPERI PTY LIMITED
#
# WHY: our fork carries divergence merged into `main` (see docs/fork/design.md),
# so an upstream bump is a real 3-way merge, not a clean rebase. `git rerere` records
# each conflict resolution once and replays it on every later merge, so recurring
# conflicts on the same upstream files resolve themselves. This job runs that
# merge on a schedule against a bot branch and surfaces the result -- it NEVER
# touches `main` directly. A human reviews + merges the PR.
#
# The rr-cache (recorded resolutions) is persisted between runs via actions/cache
# because it lives under .git and is not committed. First run for a given
# conflict is unresolved (-> issue); once a human resolves it on the PR branch and
# that resolution reaches the cache, subsequent runs replay it automatically.

name: upstream-sync

'on':
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC -- weekly drift check
  workflow_dispatch:
    inputs:
      upstream_ref:
        type: string
        required: false
        default: ''
        description:
          'Upstream ref to merge (tag/branch). Empty -> upstream/main.'
      base_ref:
        type: string
        required: false
        default: ''
        description:
          'Branch to sync ONTO. Empty -> origin/main. Set it to exercise a
          change to this workflow before that change is on main.'
      open_pr:
        type: boolean
        required: false
        default: true
        description:
          'Open a PR for the result. Turn off for a dry run that only proves the
          cycle.'

permissions:
  contents: write # push the bot branch
  pull-requests: write # open the sync PR
  issues: write # file the drift issue when conflicts remain
  security-events: read # read Dependabot alerts for the triage

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/hyperdxio/hyperdx.git
  # gh ranks a remote named `upstream` above `origin`, so without this every gh
  # call after the resolve step targets hyperdxio/hyperdx and gets a 403.
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # rerere resolutions live in .git/rr-cache (not committed) -- persist them
      # so a resolution recorded on one run replays on the next.
      - name: Restore rerere cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .git/rr-cache
          key: rr-cache-${{ github.run_id }}
          restore-keys: |
            rr-cache-

      # The merge driver is per-clone config and a fresh CI checkout has none.
      # An unconfigured driver fails OPEN - git falls back to a text merge and
      # produces 1MB of conflict markers in yarn.lock - so this is not optional.
      - name: Configure git + rerere + the lockfile driver
        run: |
          git config user.name  "dfe-upstream-bot"
          git config user.email "bot@dfe.hyperi.io"
          git config rerere.enabled true
          git config rerere.autoupdate true
          git config merge.upstream-lock.name "take upstream's lockfile, then yarn install"
          git config merge.upstream-lock.driver "$PWD/scripts/merge-lockfile.sh %O %A %B"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      # The dispatch input goes through `env:`, never straight into the shell -
      # it is free text and interpolating it into `run:` executes it.
      - name: Resolve upstream ref
        id: ref
        env:
          UPSTREAM_REF_INPUT: ${{ inputs.upstream_ref }}
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || true
          git fetch --tags upstream
          ref="${UPSTREAM_REF_INPUT}"
          if [ -z "$ref" ]; then ref="upstream/main"; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short "$ref")" >> "$GITHUB_OUTPUT"

      # The sync branch is cut BEFORE the layer is stripped. Doing it the other
      # way round strips the checked-out tree and then throws that tree away,
      # so the merge still sees the layer applied and conflicts on the
      # resolutions block exactly as if none of this existed.
      - name: Create the sync branch
        id: branch
        env:
          BASE_REF_INPUT: ${{ inputs.base_ref }}
          SHORT: ${{ steps.ref.outputs.short }}
        run: |
          base="${BASE_REF_INPUT:-origin/main}"
          branch="chore/upstream-sync-${SHORT}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Cutting $branch from $base"
          git checkout -B "$branch" "$base"

      # THE TEMPORARY LAYER COMES OFF BEFORE THE MERGE. Our security pins and
      # patches are generated, not committed, precisely so the merge sees no
      # delta in package.json's resolutions block or in a patched upstream file
      # - a delta there conflicts every cycle and rerere cannot help, because
      # the block's contents change each time so no preimage ever recurs.
      # AND COMMIT IT. `git merge` merges COMMITTED trees - an uncommitted strip
      # is invisible to the 3-way merge, so the resolutions block conflicts
      # exactly as if the strip never ran. Worse, git refuses to start at all
      # ("local changes would be overwritten by merge"), and the failure handler
      # below then finds no unresolved files, runs `git commit --no-edit`, gets
      # a non-zero exit, and dies under `bash -e` before writing `status` - so
      # every later step is skipped and the weekly run produces nothing at all.
      #
      # Latent while the register is empty, because --unapply is then a no-op
      # and the tree stays clean. It breaks the first time someone registers a
      # pin, which is the only time any of this matters.
      - name: Strip the temporary security layer
        run: |
          scripts/security-override.py --unapply
          git add -A
          git diff --cached --quiet || git commit -m 'chore: strip the fork security layer before the upstream merge'

      # Every one of these goes through `env:`. The dispatch input is free text
      # and reaches `ref` unchanged, so interpolating it into `run:` executes
      # it - which is the thing the comment above the resolve step promises we
      # never do, and did.
      - name: Merge upstream (rerere replays)
        id: merge
        env:
          REF: ${{ steps.ref.outputs.ref }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          ref="$REF"
          branch="$BRANCH"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if git merge --no-edit "$ref"; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # rerere may have staged resolutions but left the merge in-progress.
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -z "$unresolved" ]; then
            # every conflict was replayed by rerere -> finalise the merge commit.
            git commit --no-edit
            echo "status=replayed" >> "$GITHUB_OUTPUT"
          else
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            { echo 'files<<EOF'; echo "$unresolved"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Save rerere cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .git/rr-cache
          key: rr-cache-${{ github.run_id }}

      # THE LAYER GOES BACK ON. --apply reads MERGE_HEAD, so it layers over the
      # upstream just merged rather than the one left behind. A pin is re-applied
      # only where it raises the floor above upstream's own, and a patch that no
      # longer applies is reported rather than forced - both are the cycle asking
      # whether upstream has taken the fix off our hands.
      - name: Re-apply the temporary security layer
        id: relayer
        if:
          steps.merge.outputs.status == 'clean' || steps.merge.outputs.status ==
          'replayed'
        continue-on-error: true # a stale patch must surface in the PR, not kill the run
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          # NOT `--apply | tee`. A pipeline reports tee's status, which is
          # always 0, so `steps.relayer.outcome` was always 'success' and the
          # "did NOT re-apply cleanly" branch below was dead code. tee also
          # only sees stdout, and the stuck-patch report goes to stderr - so
          # the PR body carried the good news and dropped the warning.
          #
          # Outside the work tree, because the next step is `git add -A` and
          # this is scratch, not something to commit.
          status=0
          scripts/security-override.py --apply > "$RUNNER_TEMP/relayer.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/relayer.txt"
          # The pin moves even when the layer did not settle. A merge that
          # moved the upstream base but not the pin makes every later "which
          # upstream is this built on?" guesswork.
          scripts/upstream-pin.py --set "$REF" || status=1
          exit $status

      - name: Commit the regenerated layer
        if:
          steps.merge.outputs.status == 'clean' || steps.merge.outputs.status ==
          'replayed'
        run: |
          git add -A
          git diff --cached --quiet || git commit -m 'chore: re-apply the fork security layer + move the upstream pin'

      # Clean / replayed: push the branch, build+test, open a PR for review.
      - name: Push sync branch
        if:
          steps.merge.outputs.status == 'clean' || steps.merge.outputs.status ==
          'replayed'
        run:
          git push --force-with-lease origin '${{ steps.merge.outputs.branch }}'

      # THE SAFETY NET. rerere only replays TEXTUAL conflict resolutions; it
      # cannot tell whether an upstream change silently broke the behaviour of
      # our DFE deltas (embed gating, theme/fonts, oidc-identity, ...). A green
      # merge is NOT proof our fork still works -- these tests are. Never gate
      # solely on "the merge applied": gate on "our deltas still pass".
      - name: Build + test (DFE delta gate)
        id: test
        if:
          steps.merge.outputs.status == 'clean' || steps.merge.outputs.status ==
          'replayed'
        continue-on-error: true # a failure must still surface a PR, not just red the run
        run: |
          corepack enable
          # NOT --immutable: the lockfile is upstream's at this point (the merge
          # driver took it whole) and our fork-only entries have yet to be
          # re-derived. --immutable is the right flag everywhere else and the
          # wrong one exactly here.
          yarn install --mode=update-lockfile
          yarn install
          scripts/security-override.py --verify
          scripts/upstream-pin.py --verify
          # NOT `yarn build`: that is the DFE wrapper
          # `dotenvx run --env-file .env.dfe`, and .env.dfe is gitignored local
          # config that no runner has. It exits 9 before compiling anything, so
          # the gate reported failure without ever running a test.
          yarn build:common-utils
          # TYPECHECK BEFORE TESTS. `yarn test` is jest, which transpiles rather
          # than typechecks, so a merge that leaves a file referencing names
          # nothing imports still runs green here. That is not hypothetical: the
          # 2.33.0 merge produced exactly that in OnboardingModal.tsx - our
          # import block over upstream's body - and this gate passed it, six
          # times, because nothing between the merge and the PR ever ran tsc.
          # `ci:lint` per package is eslint + tsc --noEmit, which is the check
          # that was missing.
          yarn lint
          yarn test

      - name: Commit the re-derived lockfile
        if:
          steps.merge.outputs.status == 'clean' || steps.merge.outputs.status ==
          'replayed'
        run: |
          git add yarn.lock
          git diff --cached --quiet || git commit -m 'chore: re-derive the lockfile after the upstream merge'
          git push --force-with-lease origin '${{ steps.merge.outputs.branch }}'

      # An App token beats a PAT: scoped, auditable, and not tied to a person's
      # account (see the CI standard). `hyperi-container-mgt` is the app whose id
      # and key are already org-wide, so it needs no new secret here - only the
      # Dependabot-alerts READ permission added to the app itself. Until that is
      # granted this mints a token without it and the triage falls back, loudly.
      - name: Mint an App token for the Dependabot read
        id: app-token
        if:
          steps.merge.outputs.status == 'clean' || steps.merge.outputs.status ==
          'replayed'
        continue-on-error: true # no token is a degraded triage, not a failed sync
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.CONTAINER_MGT_APP_ID }}
          private-key: ${{ secrets.CONTAINER_MGT_APP_PRIVATE_KEY }}

      # The judgement calls, drafted for the reviewer. Never a gate: reachability
      # is a human verdict (docs/fork/security-sync.md), and a model that could
      # clear its own findings would rebuild the alert queue the fork's posture
      # exists to avoid. Degrades to the mechanical facts when no key is
      # configured.
      - name: Draft the security triage
        if:
          steps.merge.outputs.status == 'clean' || steps.merge.outputs.status ==
          'replayed'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # The workflow GITHUB_TOKEN cannot read Dependabot alerts whatever
          # `permissions:` says - the endpoint wants the app-level Dependabot
          # alerts permission. An App token is the house standard over a PAT, so
          # this prefers one minted above and only falls back to a PAT secret.
          # With neither, the triage uses `yarn npm audit` and says so.
          DEPENDABOT_TOKEN:
            ${{ steps.app-token.outputs.token || secrets.DEPENDABOT_TOKEN }}
        run: |
          pip install --disable-pip-version-check anthropic || true
          scripts/security-triage.py --audit --patches --carried -o triage.md
          cat triage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open sync PR
        # `inputs` is EMPTY on a schedule, so `inputs.open_pr` is null, and
        # GitHub coerces null and false alike to 0 - `inputs.open_pr != false`
        # is therefore FALSE on every cron run, which silently turned the weekly
        # sync into a merge-and-push with nobody told. Gate on the event first.
        if:
          (steps.merge.outputs.status == 'clean' || steps.merge.outputs.status
          == 'replayed') && (github.event_name != 'workflow_dispatch' ||
          inputs.open_pr)
        env:
          GH_TOKEN: ${{ github.token }}
          TEST: ${{ steps.test.outcome }}
          RELAYER: ${{ steps.relayer.outcome }}
        run: |
          if [ "$TEST" = "success" ]; then
            draft=""
            note="Build+test GREEN -- our DFE deltas survived this upstream bump."
          else
            draft="--draft"
            note="WARNING: build+test FAILED after rerere replay -- an upstream change broke our DFE deltas. DO NOT MERGE until fixed; the fix (new resolution) will be recorded into rr-cache for future replay. See docs/fork/sync-cycle.md."
          fi
          if [ "$RELAYER" != "success" ]; then
            draft="--draft"
            note="$note

          The security layer did NOT re-apply cleanly. Read the block below for which patch and why -- it is one of two very different things. STALE (neither direction applies) is the signal, not a fault: either upstream fixed it their own way (delete the patch) or the code moved (re-derive it), and the drafted verdict is in the run summary. AMBIGUOUS is a hazard: the patch applies in BOTH directions, so it names more than one site and the tooling refused to guess which. Re-derive it against the current tree before merging."
          fi
          {
            echo "Automated upstream drift sync (rerere replay: ${{ steps.merge.outputs.status }})."
            echo
            echo "$note"
            echo
            echo '## Security layer'
            echo
            echo '```'
            cat "$RUNNER_TEMP/relayer.txt" 2>/dev/null || echo '(not reached)'
            echo '```'
            echo
            echo 'Full advisory triage is in the run summary. Reachability is a HUMAN verdict -- nothing in it has been applied.'
            echo
            echo 'Review the deltas in docs/fork/what-we-changed.md, re-derive any drifted upstream copies, then merge.'
          } > pr-body.md
          gh pr create $draft \
            --base main --head '${{ steps.merge.outputs.branch }}' \
            --title 'chore: sync upstream hyperdxio/hyperdx@${{ steps.ref.outputs.short }}' \
            --body-file pr-body.md \
            || echo "PR may already exist for this branch."

      # Unresolved conflicts: no push, file/refresh a drift issue for a human.
      - name: File drift issue
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          # UPSTREAM controls these filenames. A path containing a single quote
          # broke out of the printf argument and ran, so the conflict list goes
          # through env and into a file - never through a shell word.
          SHORT: ${{ steps.ref.outputs.short }}
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          {
            echo 'rerere could not replay all conflicts. Resolve manually per'
            echo 'docs/fork/sync-cycle.md, which records the resolution into'
            echo 'rr-cache so future runs replay it.'
            echo
            echo 'Unresolved files:'
            echo '```'
            printf '%s\n' "$FILES"
            echo '```'
          } > issue-body.md
          # The label has to EXIST before --label will take it, and this repo
          # never had one. `gh issue create` failed on every conflicted run,
          # `|| echo` swallowed the failure, and the step reported success - so
          # five consecutive weekly runs went green while the fork drifted 116
          # commits behind with nobody told. --force makes this idempotent.
          gh label create upstream-sync \
            --color B60205 \
            --description 'An upstream merge rerere could not replay' \
            --force
          # An already-open issue for the same upstream ref is the ONLY tolerable
          # reason not to create one. Anything else has to fail the run: a broken
          # alarm that reports success is worse than no alarm, because the drift
          # number is the one signal that says when re-forking beats merging.
          existing="$(gh issue list --label upstream-sync --state open \
            --search "hyperdxio/hyperdx@${SHORT} in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "drift issue #${existing} is already open for ${SHORT}"
            exit 0
          fi
          gh issue create \
            --title "upstream-sync: manual merge needed for hyperdxio/hyperdx@${SHORT}" \
            --label 'upstream-sync' \
            --body-file issue-body.md
