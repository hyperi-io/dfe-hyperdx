# DFE Dev Override: DocumentDB (no app -- app runs locally)
#
# Usage (requires .env.dfe with POSTGRES_USER, POSTGRES_PASSWORD):
#   docker compose --env-file .env.dfe -f docker-compose.dev.yml -f docker-compose.dfe.dev.yml up -d
#
# Use this with docker-compose.dev.yml. The app service is not defined in dev
# (it runs locally via yarn dev), so this override omits the app section.
# For production, use docker-compose.dfe.yml instead.
#
# The local app reaches the store with this in .env.dfe, the POSTGRES_ pair
# being the DocumentDB login created on its first start:
#   MONGO_URI=mongodb://<POSTGRES_USER>:<POSTGRES_PASSWORD>@localhost:27017/hyperdx?tls=true&tlsAllowInvalidCertificates=true&authMechanism=SCRAM-SHA-256

services:
  db:
    deploy:
      replicas: 0

      # ClickHouse is built and run by the separate DFE repo (dfe-docker). The app
  # reaches it via DEFAULT_CONNECTIONS in .env.dfe (http://localhost:8124).
  ch-server:
    deploy:
      replicas: 0

  # Both collectors exist only to write into ch-server, and depend_on it as
  # service_healthy — with ClickHouse gone they would block the stack from
  # coming up, so they are disabled here too. Ingest belongs to dfe-docker.
  #
  # `build: !reset null` drops the build inherited from docker-compose.dev.yml so
  # `compose up` does not compile the collector from source for a service it never
  # starts. `image:` mirrors the prod-compose ref; with replicas 0 it is never
  # pulled or run and only lets compose skip the build.
  otel-collector:
    build: !reset null
    image: ${CH_IMAGE_REPO:-hyperdx}/${NEXT_OTEL_COLLECTOR_IMAGE_NAME_DOCKERHUB:-hyperdx-otel-collector}:${IMAGE_VERSION:-2}
    deploy:
      replicas: 0

  otel-collector-json:
    build: !reset null
    image: ${CH_IMAGE_REPO:-hyperdx}/${NEXT_OTEL_COLLECTOR_IMAGE_NAME_DOCKERHUB:-hyperdx-otel-collector}:${IMAGE_VERSION:-2}
    deploy:
      replicas: 0

  # The app runs on the host, which cannot read a CA held in a volume, so dev
  # keeps the gateway's self-signed certificate and the MONGO_URI above sets
  # tlsAllowInvalidCertificates. docker-compose.dfe.yml verifies the gateway.
  documentdb:
    image: ghcr.io/documentdb/documentdb/documentdb-local:pg18-1.0.0@sha256:03aef53ed72cd3007236f8ce1b4ef7a0c958dbbce1519074b85d8a3e10be89a5
    environment:
      USERNAME: ${POSTGRES_USER}
      PASSWORD: ${POSTGRES_PASSWORD}
      TLS_MODE: requireTLS
      # Off, the gateway listens on the container's loopback only.
      ALLOW_EXTERNAL_CONNECTIONS: 'true'
      # On by default upstream: it reports to a third party at start and hourly.
      DOCUMENTDB_USAGE_TELEMETRY: 'false'
    ports:
      - '27017:10260'
    volumes:
      - documentdb-data:/data
    networks:
      - internal
    restart: on-failure
    healthcheck:
      # The image's own probe, polled faster than its 30s default.
      test: ['CMD', '/usr/local/bin/documentdb-healthcheck']
      interval: 5s
      timeout: 10s
      start_period: 60s
      retries: 10

volumes:
  documentdb-data:

networks:
  internal:
