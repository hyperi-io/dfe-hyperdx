nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.13.0.cjs

npmMinimalAgeGate: 7d

# Advisories triaged as unreachable in what this fork actually ships. Each was
# checked against the api production closure (docker/hyperdx/Dockerfile:101),
# then against whether the vulnerable function is called and whether an
# attacker can drive it. The trace for every one is in
# docs/fork/security-sync.md, dated.
#
# Per-advisory on purpose: npmAuditExcludePackages would also mute the NEXT
# advisory against the same package, which is a risk acceptance nobody wrote.
#
# Re-check these on every upstream sync. An id here that no longer appears in
# `yarn npm audit` is dead weight and should be deleted.
npmAuditIgnoreAdvisories:
  - 1104000 # @babel/runtime - absent from the production image
  - 1113714 # ajv 8.20.0, above the < 8.18.0 range
  - 1130734 # brace-expansion - absent from the production image
  - 1130736 # brace-expansion - absent from the production image
  - 1130737 # brace-expansion - absent from the production image
  - 1104663 # cross-spawn 7.0.6, above the < 7.0.5 range
  - 1121860 # js-yaml - absent from the production image
  - 1123911 # js-yaml - absent from the production image
  - 1138114 # js-yaml - absent from the production image
  - 1138115 # js-yaml - absent from the production image
  - 1115806 # lodash - our workspaces resolve 4.18.1, above the range
  - 1115810 # lodash - our workspaces resolve 4.18.1, above the range
  - 1120370 # lodash - our workspaces resolve 4.18.1, above the range
  - 1113459 # minimatch - absent from the production image
  - 1113465 # minimatch - absent from the production image
  - 1113538 # minimatch - absent from the production image
  - 1113544 # minimatch - absent from the production image
  - 1113546 # minimatch - absent from the production image
  - 1113552 # minimatch - absent from the production image
  - 1115551 # picomatch - ReDoS needs a crafted glob; ours come from config
  - 1115554 # picomatch - ReDoS needs a crafted glob; ours come from config
  - 1112918 # semver 6.3.1, BELOW the >= 7.0.0 range
  - 1120654 # tmp - absent from the production image
  - 1115556 # yaml - absent from the production image
  # Not a vulnerability. npm deprecates the whole eslint 9.x line in favour of
  # 10.x, and 9.39.5 is its own maintenance release. eslint is dev-only and
  # never enters the image. Moving to 10.x is a config migration gated on the
  # plugins (typescript-eslint, @eslint-react) supporting it.
  - 'eslint (deprecation)'

npmPreapprovedPackages:
  - '@hyperdx/*'
  # Allow @clickhouse/client* pre-release (head) builds, which are published
  # for release validation and are newer than the npmMinimalAgeGate window.
  - '@clickhouse/*'
  # TODO: remove once nx@23.1.1 (published 2026-07-30) is older than the
  # npmMinimalAgeGate window.
  - 'nx'
  - '@nx/*'
