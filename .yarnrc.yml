  # Not a vulnerability. npm deprecates the whole eslint 9.x line in favour of
  # 10.x, and 9.39.5 is its own maintenance release. eslint is dev-only and
  # never enters the image. Moving to 10.x is a config migration gated on the
  # plugins (typescript-eslint, @eslint-react) supporting it.
  - 'eslint (deprecation)'

npmPreapprovedPackages:
  - '@hyperdx/*'
  # Allow @clickhouse/client* pre-release (head) builds, which are published
  # for release validation and are newer than the npmMinimalAgeGate window.
  - '@clickhouse/*'
  # TODO: remove once nx@23.1.1 (published 2026-07-30) is older than the
  # npmMinimalAgeGate window.
  - 'nx'
  - '@nx/*'
