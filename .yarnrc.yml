nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.13.0.cjs

npmMinimalAgeGate: 7d

# Advisories triaged as unreachable in what this fork actually ships. Each was
# checked against the api production closure (docker/hyperdx/Dockerfile:101),
# then against whether the vulnerable function is called and whether an
# attacker can drive it. The trace for every one is in
# docs/fork/security-sync.md, dated.
#
# Per-advisory on purpose: npmAuditExcludePackages would also mute the NEXT
# advisory against the same package, which is a risk acceptance nobody wrote.
#
# Re-check these on every upstream sync. An id here that no longer appears in
# `yarn npm audit` is dead weight and should be deleted.
npmAuditIgnoreAdvisories:
  - 1104000 # @babel/runtime - dev via @changesets/cli, and the image ships only its interopRequireDefault helper
  - 1158499 # @humanfs/node - absent from the production image
  - 1240600 # axios 1.18.1 - nx's exact pin, absent from the production image, which has 1.20.0
